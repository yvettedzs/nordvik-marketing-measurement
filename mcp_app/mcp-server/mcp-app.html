<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nordvik steering hub</title>
  <!-- Plotly from its CDN, allowed by _meta.ui.csp.resourceDomains on the resource content item (server.ts) -->
  <script src="https://cdn.plot.ly/plotly-4.3.0.min.js" charset="utf-8"></script>
  <style>
    .viz-root {
      color-scheme: light;
      --surface-1: #fcfcfb;
      --page: #f9f9f7;
      --text-primary: #0b0b0b;
      --text-secondary: #52514e;
      --text-muted: #898781;
      --grid: #e1e0d9;
      --axis: #c3c2b7;
      --neutral-wash: #f0efec;
      --border: rgba(11, 11, 11, 0.10);
      --series-platform: #2a78d6;
      --series-lnd: #eb6834;
      --series-tested: #1baf7a;
      --critical: #d03b3b;
      --status-good: #0ca30c;
      --status-warning: #fab219;
      --status-serious: #ec835a;
      --status-critical: #d03b3b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f9f9f7; }
    .viz-root {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 14px; line-height: 1.45; color: var(--text-primary);
      background: var(--page); padding: 16px; min-width: 320px;
    }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 12px; }
    h1 { font-size: 16px; font-weight: 600; margin: 0; }
    .badge {
      display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px;
      background: var(--neutral-wash); border: 1px solid var(--border); color: var(--text-primary);
      font-size: 12px; font-weight: 600;
    }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-left: auto; }
    .controls label { color: var(--text-secondary); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
    select, button {
      font: inherit; font-size: 13px; color: var(--text-primary); background: var(--surface-1);
      border: 1px solid var(--axis); border-radius: 6px; padding: 4px 8px;
    }
    button { cursor: pointer; }
    button:hover, select:hover { border-color: var(--text-muted); }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--series-platform); outline-offset: 1px; }
    .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
    h2 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
    .subtitle { color: var(--text-secondary); margin: 0 0 8px; font-size: 13px; }
    .banner {
      border: 1px solid var(--text-primary); border-radius: 6px; padding: 6px 10px; margin: 8px 0;
      font-size: 13px; background: var(--neutral-wash);
    }
    .banner strong { font-weight: 600; }
    .error { border-left: 3px solid var(--critical); padding: 8px 12px; background: var(--neutral-wash); border-radius: 4px; }
    .error .label { font-weight: 600; margin-right: 6px; }
    #chart { width: 100%; height: 460px; }
    .panel-note { color: var(--text-secondary); font-size: 13px; margin: 4px 0 0; }
    .caveats { margin: 10px 0 0; padding-left: 18px; color: var(--text-secondary); font-size: 13px; }
    .caveats li { margin: 2px 0; }
    .caveats-title { font-size: 13px; font-weight: 600; margin: 12px 0 0; color: var(--text-primary); }
    .link-button { background: none; border: none; padding: 0; color: var(--text-primary); text-decoration: underline; font-size: 13px; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 8px; }
    th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
    th { color: var(--text-secondary); font-weight: 600; position: sticky; top: 0; background: var(--surface-1); }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
    .scroll { max-height: 340px; overflow: auto; border: 1px solid var(--grid); border-radius: 6px; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
    footer { color: var(--text-secondary); font-size: 12px; }
    footer dl { margin: 4px 0 0; }
    footer dt { font-weight: 600; color: var(--text-primary); margin-top: 6px; }
    footer dd { margin: 0; }
    footer code { font-size: 12px; }
    .options-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 0 0 12px; }
    .options-row label { color: var(--text-secondary); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
    .options-row:empty { display: none; }
    select:disabled { color: var(--text-secondary); background: var(--neutral-wash); cursor: not-allowed; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin: 4px 0; }
    .tile {
      display: flex; flex-direction: column; justify-content: flex-start; align-items: flex-start; width: 100%; text-align: left; background: var(--surface-1); border: 1px solid var(--axis);
      border-radius: 8px; padding: 12px; font-size: 13px; line-height: 1.4;
    }
    .tile:hover { border-color: var(--text-secondary); }
    .tile-kicker { color: var(--text-muted); font-size: 12px; }
    .tile-name { font-weight: 600; font-size: 14px; margin: 2px 0 6px; }
    .tile .tile-detail { color: var(--text-secondary); margin-top: 6px; }
    .tile .tile-link { margin-top: 8px; text-decoration: underline; font-size: 12px; }
    .status-chip { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; }
    .status-icon {
      display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px;
      border-radius: 50%; font-size: 11px; font-weight: 700; color: #ffffff;
    }
    .status-icon.st-warning { color: #0b0b0b; }
    .stat-tile { max-width: 360px; }
    .stat-tile .hero { font-size: 48px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; margin: 6px 0; }
    .kv { width: auto; min-width: 50%; margin: 4px 0 8px; }
    .kv th { position: static; width: 220px; }
    tr.hl td { background: var(--neutral-wash); font-weight: 600; }
    .audit-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
    .audit-head label { color: var(--text-secondary); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
    td.mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; word-break: break-all; }
    td.nowrap { white-space: nowrap; word-break: normal; }
    /* HTML legend: wraps on narrow widths, so it can never run into the chart */
    .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--text-primary); margin: 4px 0 2px; }
    .legend-item { display: inline-flex; align-items: center; gap: 6px; }
    .sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; flex: none; }
    .sw-platform { background: var(--series-platform); }
    /* hatch directions match the bars: "/" for last non-direct, "\" for tested */
    .sw-lnd { background: repeating-linear-gradient(135deg, var(--series-lnd) 0 3px, var(--surface-1) 3px 4.5px); }
    .sw-tested { background: repeating-linear-gradient(45deg, var(--series-tested) 0 3px, var(--surface-1) 3px 4.5px); }
    .sw-truth { height: 3px; border-radius: 0; background: var(--text-primary); }
    .sw-breakeven { width: 18px; height: 0; border-radius: 0; border-top: 1.5px solid var(--text-secondary); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="viz-root">
    <header>
      <span class="badge" aria-label="All data is simulated">Simulated data</span>
      <h1>Nordvik steering hub</h1>
      <div class="controls">
        <label>Role <select id="role-select" aria-label="Role"></select></label>
        <label>View <select id="view-select" aria-label="View"></select></label>
        <label id="overlay-control" hidden>
          <input type="checkbox" id="overlay-toggle"> Simulated truth (validation only)
        </label>
      </div>
    </header>

    <div id="view-options" class="options-row" aria-label="View options"></div>

    <div id="status" class="card" role="status">Waiting for a view…</div>

    <section id="view" class="card" hidden aria-live="polite">
      <h2 id="view-title"></h2>
      <p id="view-subtitle" class="subtitle"></p>
      <div id="overlay-banner" class="banner" hidden>
        <strong>Simulated truth shown</strong>: validation only: not observable in real data.
        <span id="overlay-banner-text"></span>
      </div>
      <div id="chart-legend" class="legend" hidden></div>
      <div id="chart" role="img" aria-label="Chart"></div>
      <div id="tiles" hidden></div>
      <p id="panel-note" class="panel-note"></p>
      <button id="table-toggle" class="link-button" type="button" aria-expanded="false">Show as table</button>
      <div id="table-view" hidden></div>
      <p class="caveats-title">Caveats</p>
      <ul id="caveats" class="caveats"></ul>
    </section>

    <section id="drilldown" class="card" hidden aria-live="polite">
      <div class="row">
        <h2 id="drill-title"></h2>
        <label id="drill-market-wrap" class="subtitle" style="margin:0">Market <select id="drill-market" aria-label="Filter by market"></select></label>
        <button id="drill-close" type="button" style="margin-left:auto">Close</button>
      </div>
      <p id="drill-subtitle" class="subtitle"></p>
      <p id="drill-note" class="banner" hidden></p>
      <div id="drill-kv"></div>
      <div id="drill-table" class="scroll"></div>
      <ul id="drill-caveats" class="caveats"></ul>
    </section>

    <section id="audit" class="card" aria-live="polite">
      <div class="audit-head">
        <h2>Audit log</h2>
        <button id="audit-toggle" type="button" aria-expanded="false">Show audit log</button>
        <span id="audit-controls" hidden>
          <label>Rows <select id="audit-limit" aria-label="Number of audit entries">
            <option value="20">20</option><option value="50" selected>50</option><option value="200">200</option>
          </select></label>
          <button id="audit-refresh" type="button">Refresh</button>
        </span>
      </div>
      <div id="audit-body" hidden>
        <p id="audit-subtitle" class="subtitle"></p>
        <div id="audit-table" class="scroll"></div>
      </div>
    </section>

    <footer id="footer" class="card" hidden></footer>
  </div>
  <script type="module" src="./src/mcp-app.js"></script>
</body>
</html>
