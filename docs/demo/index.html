<body>
  <div class="demo-banner" role="note" style="position:sticky;top:0;z-index:10;margin:0;padding:8px 16px;background:#0b0b0b;color:#fcfcfb;font:600 13px/1.4 system-ui,-apple-system,'Segoe UI',sans-serif;text-align:center">Interactive demo: recorded responses from simulated data. Roles are switched in the browser; this is not access control.</div>
  <div class="viz-root">
    <header>
      <span class="badge" aria-label="All data is simulated">Simulated data</span>
      <h1>Nordvik steering hub</h1>
      <div class="controls">
        <label>Role <select id="role-select" aria-label="Role"></select></label>
        <label>View <select id="view-select" aria-label="View"></select></label>
        <label id="overlay-control" hidden>
          <input type="checkbox" id="overlay-toggle"> Simulated truth (validation only)
        </label>
      </div>
    </header>

    <div id="view-options" class="options-row" aria-label="View options"></div>

    <div id="status" class="card" role="status">Waiting for a view…</div>

    <section id="view" class="card" hidden aria-live="polite">
      <h2 id="view-title"></h2>
      <p id="view-subtitle" class="subtitle"></p>
      <div id="overlay-banner" class="banner" hidden>
        <strong>Simulated truth shown</strong>: validation only: not observable in real data.
        <span id="overlay-banner-text"></span>
      </div>
      <div id="chart-legend" class="legend" hidden></div>
      <div id="chart" role="img" aria-label="Chart"></div>
      <div id="tiles" hidden></div>
      <p id="panel-note" class="panel-note"></p>
      <button id="table-toggle" class="link-button" type="button" aria-expanded="false">Show as table</button>
      <div id="table-view" hidden></div>
      <p class="caveats-title">Caveats</p>
      <ul id="caveats" class="caveats"></ul>
    </section>

    <section id="drilldown" class="card" hidden aria-live="polite">
      <div class="row">
        <h2 id="drill-title"></h2>
        <label id="drill-market-wrap" class="subtitle" style="margin:0">Market <select id="drill-market" aria-label="Filter by market"></select></label>
        <button id="drill-close" type="button" style="margin-left:auto">Close</button>
      </div>
      <p id="drill-subtitle" class="subtitle"></p>
      <p id="drill-note" class="banner" hidden></p>
      <div id="drill-kv"></div>
      <div id="drill-table" class="scroll"></div>
      <ul id="drill-caveats" class="caveats"></ul>
    </section>

    <section id="audit" class="card" aria-live="polite">
      <div class="audit-head">
        <h2>Audit log</h2>
        <button id="audit-toggle" type="button" aria-expanded="false">Show audit log</button>
        <span id="audit-controls" hidden>
          <label>Rows <select id="audit-limit" aria-label="Number of audit entries">
            <option value="20">20</option><option value="50" selected>50</option><option value="200">200</option>
          </select></label>
          <button id="audit-refresh" type="button">Refresh</button>
        </span>
      </div>
      <div id="audit-body" hidden>
        <p id="audit-subtitle" class="subtitle"></p>
        <div id="audit-table" class="scroll"></div>
      </div>
    </section>

    <footer id="footer" class="card" hidden></footer>
  </div>
</body>
</html>
